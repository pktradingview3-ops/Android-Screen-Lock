name: Android debug APK

# Builds the debug APK and runs unit tests on GitHub's runner, so the project
# can be checked without a local Android SDK. Download the APK from the run's
# "Artifacts" section.

on:
  push:
    branches:
      - "arena/**"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timewall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
