name: Android build and tests

# 1) build job: unit tests + debug APK (download "timewall-debug-apk" from the run).
# 2) emulator job: UI and rendering tests on an Android 11 (API 30) emulator,
#    the same Android version as the target vivo Y31.

on:
  push:
    branches:
      - "arena/**"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests, debug APK, and compile UI tests
        run: bash scripts/run-gradle.sh :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timewall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on API 30 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          disable-spellchecker: true
          script: bash scripts/run-gradle.sh :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
